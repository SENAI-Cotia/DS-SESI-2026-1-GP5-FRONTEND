<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Etrooc</title>
    <link rel="stylesheet" href="cadastro.css">


</head>


<body class="fundo">
    <div class="container">

        <div class="container-barra">
            <div class="preenchimento-barra" style="width: 25%;">25%</div>
        </div>

        <div class="login-card">
            <h1>Cadastro</h1>
            <p>Preencha os dados de cadastro para se cadastrar</p>

            <form>
                <label for="email">Email ou CPF</label>
                <input type="text" id="email" name="email" placeholder="email ou cpf">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="senha de acesso">

                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <section class="circulo">
        <p>Não tem cadastro?</p>
        <a href="#">Me cadastrar</a>
    </section>
</body>

</html>
