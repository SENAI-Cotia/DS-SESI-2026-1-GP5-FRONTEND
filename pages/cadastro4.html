<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="/assets/icons/logo-etrooc-infinito.png" type="image/svg+xml">
    <link rel="stylesheet" href="../styles/cadastro4.css">
    

</head>

<body class="fundo">
    <div class="container">
        <div class="login-card">
            <h2>Bem vindo ao <img class="logoIcon" src="logo icon etrooc.svg" alt=""></h2>
            <p>Preencha os dados de login para acessar</p>

            <form>
                <label for="email">Email ou CPF</label>
                <input type="text" id="email" name="email" placeholder="email ou cpf">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="senha de acesso">

                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <section class="circulo">
        <p>Não tem cadastro?</p>
        <a href="#">Me cadastrar</a>
    </section>
</body>

</html>
