<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">
    <link rel="stylesheet" href="../styles/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

</head>

<body class="fundo">
    <div class="container">
        <div class="login-card">
            <h2>Bem vindo ao <img class="logoIcon" src="../assets/icons/logo icon etrooc.svg" alt=""></h2>
            <p>Preencha os dados de login para acessar.</p>

            <form>
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Email">

                <label for="senha">Senha</label>

                <div class="senha-container">
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
                    <button type="button" class="toggle-senha" data-target="senha" aria-label="Mostrar/ocultar senha">

                        <!-- Olho aberto -->
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>

                        <!-- Olho fechado -->
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94" />
                            <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.69" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>

                    </button>

                </div>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <section class="circulo">
        <div class="text-circulo">
            <p>Não tem cadastro?</p>
            <a href="cadastro.html">Me cadastrar</a>
        </div>
    </section>
    <script type="module" src="../script/navbar.js"></script>
    <script src="../script/login.js"></script>
</body>

</html>
