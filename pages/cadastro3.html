<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">
    <link rel="stylesheet" href="../styles/cadastro3.css">
    <script src="../script/navbar.js"></script>
</head>

<body class="fundo">

    <section class="circulo">
        <p>Já tem cadastro?</p>
        <a href="login.html">Fazer login</a>
    </section>

    <div class="container">
        <div class="login-card">
            <i><img class="barraCad" src="../assets/img/barra75.svg" alt=""></i>
            <h1 class="labelCad">Cadastro</h1>
            <p>Preencha os dados de cadastro para se cadastrar</p>

            <form>
                <label for="senha">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
                    <button type="button" class="toggle-senha" data-target="senha" aria-label="Mostrar/ocultar senha">
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <label for="confirmar-senha">Confirmar Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha">
                    <button type="button" class="toggle-senha" data-target="confirmar-senha" aria-label="Mostrar/ocultar senha">
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <ul class="regras-senha">
                    <li> Mínimo de 8 caracteres</li>
                    <li> Ao menos uma letra maiúscula</li>
                    <li> Ao menos um número</li>
                    <li> Ao menos um caractere especial (!@#$%)</li>
                </ul>

                <div id="mensagem-senha"></div>


                <div class="botoes">
                    <div class="voltar">
                        <button type="button">Voltar</button>
                    </div>

                    <div class="branco">
                        <button type="button">Avançar</button>
                    </div>
                </div>

            </form>
        </div>
    </div>
<script src="../script/cadastro3.js"></script>
</body>

</html>
