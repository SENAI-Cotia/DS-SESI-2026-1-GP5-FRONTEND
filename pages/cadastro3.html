<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">
    <link rel="stylesheet" href="../styles/cadastro3.css">

</head>

<body class="fundo">

    <div class="container">
        <div class="login-card">
            <i><img class="barraCad" src="../assets/img/barra75.svg" alt=""></i>
            <h1 class="labelCad">Cadastro</h1>
            <p>Preencha os dados de cadastro para se cadastrar</p>

            <form>
                <label for="senha">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

                    <button type="button" class="toggle-senha" data-target="senha" aria-label="Mostrar/ocultar senha">

                        <!-- Olho aberto -->
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>

                        <!-- Olho fechado -->
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94" />
                            <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.69" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>

                    </button>
                </div>

                <label for="confirmar-senha">Confirmar Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha">

                    <button type="button" class="toggle-senha" data-target="confirmar-senha"
                        aria-label="Mostrar/ocultar senha">

                        <!-- Olho aberto -->
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>

                        <!-- Olho fechado -->
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94" />
                            <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.69" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>

                    </button>
                </div>

                <ul class="regras-senha">
                    <li> Mínimo de 8 caracteres</li>
                    <li> Ao menos uma letra maiúscula</li>
                    <li> Ao menos um número</li>
                    <li> Ao menos um caractere especial (!@#$%)</li>
                </ul>

                <div id="mensagem-senha"></div>


                <div class="botoes">
                    <div class="voltar">
                        <button type="button">Voltar</button>
                    </div>

                    <div class="branco">
                        <button type="button">Avançar</button>
                    </div>
                </div>

            </form>
        </div>
    </div>


    <script src="../script/cadastro3.js"></script>
    <script type="module" src="../script/navbar.js"></script>
</body>

</html>
