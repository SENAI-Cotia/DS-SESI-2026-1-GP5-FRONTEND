<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <script src="../script/navbar.js"></script>
</head>

<body class="fundo">

    <section class="circulo">
        <p>Já tem cadastro?</p>
        <a href="login.html">Fazer login</a>
    </section>

    <div class="container">
        <div class="login-card">
            <i><img class="barraCad" src="../assets/img/barra25.svg" alt=""></i>
            <h1 class="labelCad">Cadastro</h1>
            <p>Preencha os dados de cadastro para se cadastrar</p>

            <form>
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" placeholder="email">

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="cpf">

                <label for="rm">RM</label>
                <input type="text" id="rm" name="rm" placeholder="registro de matrícula">

                <div class="botoes">
                    <div class="voltar">
                    <button type="button">Voltar</button>
                    </div>

                    <div class="branco">
                        <button type="button">Avançar</button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script src="../script/cadastro.js"></script>
</body>

</html>
