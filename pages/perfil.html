<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/perfil.css">
    <link rel="stylesheet" href="../styles/dark-mode.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="inicio.html"><img src="../assets/icons/logo icon etrooc.svg" alt="ETROOC"></a>
        </div>
        <nav>
            <ul>
                <li><a href="inicio.html">INÍCIO</a></li>
                <li><a href="comunidade.html">COMUNIDADE</a></li>
            </ul>
        </nav>
        <div class="nav-right">
            <div class="icons">
                <a href="criarprod.html"><img src="../assets/img/sinaldemais.png" alt="Adicionar"></a>
                <a href="interesses-recebidos.html"><img src="../assets/icons/sino.svg" alt="Notificações" class="sino-header"></a>
            </div>
            <div class="nav-divider"></div>
            <a class="user-info" href="perfil.html">
                <div class="avatar" id="nav-avatar"></div>
                <div class="user-meta">
                    <span class="user-name" id="nav-user-name"></span>
                    <span class="user-curso" id="nav-user-curso"></span>
                </div>
            </a>
        </div>
    </header>

    <div class="main-wrapperr">

        <div class="main-wrapper">

            <div class="sidebar">
                <div class="profile-box">
                    <div class="avatar-container">
                        <div id="sidebar-avatar">U</div>
                        <i class="fa-solid fa-pen edit-pen-avatar"></i>
                    </div>
                    <div>
                        <p>Meu perfil</p>
                        <h3 id="sidebar-firstname">Usuário</h3>
                    </div>
                </div>
                <a href="perfil.html" class="nav-item active">
                    <i class="fa-solid fa-gear"></i> Configurações da minha conta
                </a>
                <a href="acessibilidade.html" class="nav-item">
                    <i class="fa-solid fa-child"></i> Acessibilidade
                </a>
                <a href="ultimos-pedidos.html" class="nav-item">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Últimos pedidos
                </a>
                <a href="ajuda.html" class="nav-item">
                    <i class="fa-solid fa-circle-question"></i> Central de ajuda
                </a>
                <a href="interesses-recebidos.html" class="nav-item">
                    <i class="fa-solid fa-bell"></i> Interesses recebidos
                </a>
                <a href="itens-a-venda.html" class="nav-item" style="border-bottom:none;">
                    <i class="fa-solid fa-bag-shopping"></i> Itens à venda
                </a>
            </div>

            <div class="info-card">
                <h2>Informações da conta</h2>

                <div class="form-grid">

                    <div class="field">
                        <label>Nome</label>
                        <input type="text" id="profile-name" disabled>
                        <i class="fa-solid fa-pen edit-icon"></i>
                    </div>

                    <div class="field">
                        <label>Sobrenome</label>
                        <input type="text" id="profile-lastname" disabled>
                        <i class="fa-solid fa-pen edit-icon"></i>
                    </div>

                    <div class="field">
                        <label>Celular</label>
                        <input type="text" id="profile-phone" disabled>
                        <i class="fa-solid fa-pen edit-icon"></i>
                    </div>

                    <div class="field">
                        <label>Email</label>
                        <input type="text" id="profile-email" disabled>
                        <i class="fa-solid fa-pen edit-icon"></i>
                    </div>

                    <div class="field">
                        <label>RM</label>
                        <input type="text" id="profile-rm" disabled>
                        <i class="fa-solid fa-pen edit-icon"></i>
                    </div>

                    <div class="field">
                        <label>Curso</label>
                        <select id="profile-curso" disabled>
                            <option value="Informática">Informática</option>
                            <option value="Administração">Administração</option>
                            <option value="Design">Design</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Publicidade e Propaganda">Publicidade e Propaganda</option>
                        </select>
                        <i class="fa-solid fa-pen edit-icon"></i>
                    </div>

                </div>

                <div class="save-actions">
                    <button id="save-profile-btn" class="save-btn" type="button">
                        Salvar alterações
                    </button>

                    <button id="logout-btn" class="logout-btn" type="button">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Sair da conta
                    </button>
                </div>

            </div>

        </div>

        <script src="../script/navbar.js"></script>
        <script src="../script/perfil.js"></script>
</body>

</html>
