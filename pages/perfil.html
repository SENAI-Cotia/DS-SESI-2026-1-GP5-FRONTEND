<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/perfil.css">
    <link rel="stylesheet" href="../styles/navbar.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="inicio.html"><img src="../assets/icons/logo icon etrooc.svg" alt=""></a>
        </div>
        <nav>
            <ul>
                <li><a href="inicio.html">INÍCIO</a></li>
                <li><a href="#">COMUNIDADE</a></li>
            </ul>
        </nav>
        <div class="icons">
            <a href="criarprod.html"><img src="../assets/img/sinaldemais.png" alt="Adicionar"></a>
            <a href="#"><img src="../assets/img/sino.png" alt="Notificações"></a>
        </div>
        <a class="user-info" href="perfil.html">
            <div class="avatar" id="profile-avatar">U</div>
            <div class="user-meta">
                <span class="user-name" id="profile-name-display">Usuário</span>
                <span class="user-curso" id="profile-curso-display"></span>
            </div>
        </a>
    </header>

    <div class="main-wrapper">

        <div class="sidebar">
            <div class="profile-box">
                <div class="avatar-container">
                    <div id="sidebar-avatar">U</div>
                    <i class="fa-solid fa-pen edit-pen-avatar"></i>
                </div>
                <div>
                    <p>Meu perfil</p>
                    <h3 id="sidebar-firstname">Usuário</h3>
                </div>
            </div>

            <div class="nav-item active"><i class="fa-solid fa-gear"></i> Configurações da minha conta</div>
            <div class="nav-item"><i class="fa-solid fa-child"></i> Acessibilidade</div>
            <div class="nav-item"><i class="fa-solid fa-arrow-rotate-left"></i> Últimos pedidos</div>
            <div class="nav-item"><i class="fa-solid fa-circle-question"></i> Central de ajuda</div>
            <div class="nav-item" style="border-bottom:none;"><i class="fa-solid fa-bag-shopping"></i> Itens à venda
            </div>
        </div>

        <div class="info-card">
            <h2>Informações da conta</h2>

            <div class="form-grid">

                <div class="field">
                    <label>Nome</label>
                    <input type="text" id="profile-name" value="mafalda" disabled>
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>

                <div class="field">
                    <label>Sobrenome</label>
                    <input type="text" id="profile-lastname" value="Augusto" disabled>
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>

                <div class="field">
                    <label>Celular</label>
                    <input type="text" id="profile-phone" value="(11) *****-1733" disabled>
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="text" id="profile-email" value="pi************1208@gmail.com" disabled>
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>

                <div class="field">
                    <label>Número de identidade</label>
                    <input type="text" id="profile-id" value="123-456-789-01" disabled>
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>

                <div class="field">
                    <label>Data de nascimento</label>
                    <input type="text" id="profile-birthdate" value="05/12/2008" disabled>
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>

                <div class="gender-box">
                    <label>Gênero</label>
                    <div class="radio-group">
                        <label><input type="radio" name="g" checked> Masculino</label>
                        <label><input type="radio" name="g"> Feminino</label>
                        <label><input type="radio" name="g"> Prefiro não informar</label>
                    </div>
                </div>

                <div class="field">
                    <label>RM</label>
                    <input type="text" id="profile-rm" value="112233" disabled>
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>

            </div>
        </div>

        <div class="history-card">
            <h2>Produtos vendidos</h2>
            <div id="sold-products" class="sold-products">
                <p>Carregando produtos...</p>
            </div>
        </div>

        <script src="../script/perfil.js"></script>
</body>

</html>
