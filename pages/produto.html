<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/produto.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
    <script src="../script/navbar.js"></script>
    <script src="../script/produto.js"></script>
    <link rel="stylesheet" href="../styles/dark-mode.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="inicio.html"><img src="../assets/icons/logo icon etrooc.svg" alt="ETROOC"></a>
        </div>
        <nav>
            <ul>
                <li><a href="inicio.html">INÍCIO</a></li>
                <li><a href="comunidade.html">COMUNIDADE</a></li>
            </ul>
        </nav>
        <div class="nav-right">
            <div class="icons">
                <a href="criarprod.html"><img src="../assets/img/sinaldemais.png" alt="Adicionar"></a>
                <a href="interesses-recebidos.html"><img src="../assets/icons/sino.svg" alt="Notificações" class="sino-header"></a>
            </div>
            <div class="nav-divider"></div>
            <a class="user-info" href="perfil.html">
                <div class="avatar" id="nav-avatar">U</div>
                <div class="user-meta">
                    <span class="user-name" id="nav-user-name">Usuário</span>
                    <span class="user-curso" id="nav-user-curso"></span>
                </div>
            </a>
        </div>
    </header>

    <main class="container">
        <section class="product-main">
            <div class="product-gallery">
                <div class="main-img-card">
                    <img id="product-main-image" src="../assets/img/etrooc.png" alt="Produto">
                </div>
                <div class="thumbnails" id="gallery-thumbnails"></div>

                <div id="modal" class="modal">
                    <span class="fechar" onclick="fecharImagem()">
                        <img src="../assets/icons/icon-x.svg" alt="x">
                    </span>

                    <img id="modal-image" src="" alt="Imagem ampliada" class="img">
                </div>
            </div>

            <div class="product-details">
                <div class="user-info">
                    <div class="avatar-container">
                        <div id="sidebar-avatar-product-owner"></div>
                    </div>
                    <div>
                        <strong id="seller-name">Usuário</strong> <span class="time" id="seller-time">Há 1
                            dia</span><br>
                        <span class="dept" id="seller-dept">curso</span>
                    </div>
                </div>

                <h1 class="product-title" id="product-title">Produto</h1>
                <p class="price" id="product-price">R$ 0,00</p>
                <p class="description" id="product-description">
                    Descrição do produto será carregada aqui.
                </p>
                <div class="schedule-grid">

                    <div class="column">

                        <label>Local</label>

                        <div id="locais-container"></div>

                    </div>

                    <div class="column">

                        <label>Horário</label>

                        <div id="horarios-container"></div>

                    </div>

                </div>

                <button class="btn-entregue">DEMONSTRAR INTERESSE<span></span></button>
            </div>
        </section>
    </main>

    <style>
        .tag {
            display: inline-block;
            padding: 8px 16px;
            margin: 4px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background-color: #e8e8e8;
        }

        .tag.active {
            background-color: #f43170;
            color: white;
            border-color: #f43170;
        }
    </style>

</body>

</html>
