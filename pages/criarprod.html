<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETROOC</title>
    <link rel="icon" href="../assets/icons/logo-etrooc-infinito.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/criarprod.css">
    <link rel="stylesheet" href="../styles/dark-mode.css">
    <script src="../script/acessibilidade.js"></script>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="inicio.html"><img src="../assets/icons/logo icon etrooc.svg" alt="ETROOC"></a>
        </div>
        <nav>
            <ul>
                <li><a href="inicio.html">INÍCIO</a></li>
                <li><a href="comunidade.html">COMUNIDADE</a></li>
            </ul>
        </nav>
        <div class="nav-right">
            <div class="icons">
                <a href="criarprod.html"><img src="../assets/img/sinaldemais.png" alt="Adicionar"></a>
                <a href="interesses-recebidos.html"><img src="../assets/icons/sino.svg" alt="Notificações"
                        class="sino-header"></a>
            </div>
            <div class="nav-divider"></div>
            <a class="user-info" href="perfil.html">
                <div class="avatar" id="nav-avatar">U</div>
                <div class="user-meta">
                    <span class="user-name" id="nav-user-name">Usuário</span>
                    <span class="user-curso" id="nav-user-curso"></span>
                </div>
            </a>
        </div>
    </header>

    <div class="container">

        <div>
            <div class="image-upload" id="uploadArea">
                <div class="upload-icon">↑</div>
                <span>ADICIONAR IMAGEM</span>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple>
            </div>

            <div class="thumbnail-container">

                <div class="thumbnail"></div>
                <div class="thumbnail"></div>

            </div>
        </div>


        <div class="form-section">
            <h1 class="form-header">NOVO PRODUTO</h1>

            <div class="input-group">
                <label>NOME</label>
                <input type="text" id="nome" placeholder="Nome do produto">
            </div>

            <div class="input-group">
                <label>preço (R$)</label>
                <input type="text" id="preco" placeholder="0,00">
            </div>

            <div class="input-group">
                <label>Descrição</label>
                <textarea class="description" id="descricao" placeholder="Descreva o produto..."></textarea>
            </div>



            <div class="condicao-wrapper">
                <div class="condicao-header">
                    <label class="condicao-label" for="condicao">Condição do produto</label>
                    <span class="condicao-ajuda">1 = muito usado · 10 = novo</span>
                </div>

                <div class="condicao-slider-box">
                    <input type="range" id="condicao" min="1" max="10" required>
                    <span id="condicaoValor"></span>
                </div>
            </div>



            <div class="two-columns">

                <div class="list-box">
                    <h3>Locais de troca disponíveis</h3>
                    <div id="locais-list"></div>
                    <button type="button" class="add-btn" id="add-local-btn">
                        <strong>+</strong> Adicionar local
                    </button>
                </div>


                <div class="list-box">
                    <h3>Horários de troca disponíveis</h3>
                    <div id="horarios-list"></div>
                    <button type="button" class="add-btn" id="add-horario-btn">

                        <strong>+</strong> Adicionar horário

                    </button>
                </div>

            </div>

            <button type="button" class="publicar-btn" id="publicar-btn">
                PUBLICAR
            </button>

        </div>

    </div>
    <script src="../script/navbar.js"></script>
    <script src="../script/criarprod.js"></script>
</body>

</html>
